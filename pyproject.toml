[project]
name = "agentic-registrar-backend"
version = "0.1.0"
description = "AI-powered university registrar automation system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    # passlib 1.7.4 is incompatible with bcrypt 4.x — its self-detection
    # routine triggers ValueError on a long-password probe. Pin bcrypt
    # to <4.0 until passlib ships a fix.
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Silence the known pytest-asyncio + aiosqlite teardown warning where the
# aiosqlite worker thread tries to push results onto an event loop that
# pytest-asyncio has already closed. The result of the test run is not
# affected; the warning just clutters output.
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

