[project]
name = "agentic-registrar-backend"
version = "0.1.0"
description = "Agentic Registrar backend monorepo for Addis Ababa University."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Addis Ababa University", email = "devnull@example.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "minio>=7.2.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E501"]
src = ["services", "packages"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["services", "packages"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.uv.workspace]
members = [
    "services/api-gateway",
    "services/identity-service",
    "services/undergrad-admission-service",
    "services/graduate-admission-service",
    "services/course-management-service",
    "services/notification-service",
    "services/document-service",
    "packages/shared-kernel",
    "packages/contracts",
    "packages/agent-core",
    "packages/policy-engine",
    "packages/rag-core",
    "packages/test-utils",
]
